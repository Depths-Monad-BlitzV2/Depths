[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# verifikasi Sourcify (MonadVision), rekomendasi docs.monad.xyz/guides/verify-smart-contract/foundry
bytecode_hash = "none" # padanan foundry untuk metadata_hash = "none" di docs Monad
use_literal_content = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# GenVectors.t.sol menulis test vectors untuk parity test packages/game-logic; Deploy.s.sol menulis deployments/
fs_permissions = [
    { access = "read-write", path = "./test/vectors" },
    { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
anvil = "http://127.0.0.1:8545"

[fmt]
line_length = 120
